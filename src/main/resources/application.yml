spring:
    data:
        mongodb:
            uri: ${MONGODB_URI:mongodb+srv://vsolabswork:Vs0labs25@cluster0.o5mrlm7.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0}
            database: ${MONGODB_DATABASE:daddyJohn}
            auto-index-creation: true

    # File upload configuration
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 50MB
            enabled: true

    # Enable scheduling for monthly reset
    task:
        scheduling:
            pool:
                size: 2

logging:
    level:
        com.vso.DaddyJohn: ${LOG_LEVEL:INFO}
        com.vso.DaddyJohn.Service.MessageService: DEBUG
        org.springframework.web.client.RestTemplate: DEBUG
        org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
        org.springframework.web.cors: ${CORS_LOG_LEVEL:INFO}

server:
    port: ${PORT:8080}

app:
    jwt:
        secret: ${JWT_SECRET:YourDefaultSecretValueIfNotProvided}
        expiration-ms: ${JWT_EXPIRATION_MS:3600000}

    # File storage configuration
    file:
        upload-dir: ${UPLOAD_DIR:uploads}
        base-url: ${FILE_BASE_URL:http://localhost:8080/files}

    # Subscription Plan Configuration
    plans:
        limits:
            free:
                tokens: ${PLAN_FREE_TOKENS:500}
                display-name: Free
                description: Free tier with 500 tokens per month
            medium:
                tokens: ${PLAN_MEDIUM_TOKENS:1500}
                display-name: Medium
                description: Medium tier with 1500 tokens per month
            high:
                tokens: ${PLAN_HIGH_TOKENS:5000}
                display-name: High
                description: High tier with 5000 tokens per month
            unlimited:
                tokens: ${PLAN_UNLIMITED_TOKENS:-1}
                display-name: Unlimited
                description: Unlimited tokens per month

services:
    chatbot:
        django-url: ${DJANGO_API_URL:http://localhost:3000}
